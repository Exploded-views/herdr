# herdr-fork: fork-only workflow. Builds fork binaries when the fork's admin pushes a fork tag
# (vX.Y.Z-ev.N) and attaches them, with checksums, to a GitHub release. Runs only in
# Exploded-views/herdr. No signing, no notarization, no secrets beyond the automatic
# GITHUB_TOKEN. The tag is resolved once to a commit that must be on integ/next, and every job
# builds that exact commit. No shared build cache: a release is a clean build. Upstream's
# release.yml also fires on a fork tag, but its jobs are guarded to herdrdev/herdr and skip
# (see docs/releases.md). Unofficial stopgap; see FORK.md.
name: fork-release

on:
  push:
    tags:
      - "v*-ev.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing fork tag to (re)build and publish, e.g. v1.2.3-ev.1"
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: fork-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  # Rejects anything that is not a fork tag (pushes and manual runs alike), checks that the actor
  # is an admin, and resolves the tag to one commit that must be on integ/next.
  prepare:
    if: github.repository == 'Exploded-views/herdr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Require repository admins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for actor in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" --jq .permission)"
            if [ "$permission" != "admin" ]; then
              echo "error: $actor must have repository admin permission to publish" >&2
              exit 1
            fi
          done

      - name: Validate the tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            echo "error: not a tag run" >&2
            exit 1
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-ev\.[0-9]+(-rc[0-9]+)?$'; then
            echo "error: '$tag' is not a fork tag (vX.Y.Z-ev.N or vX.Y.Z-ev.N-rcM)" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
            echo "error: run from the tag itself ('Use workflow from: $tag'), not from $GITHUB_REF" >&2
            exit 1
          fi
          prerelease=false
          case "$tag" in *-rc*) prerelease=true ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Fetch history and tags
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the tag to a commit on integ/next
        id: resolve
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/heads/integ/next:refs/remotes/origin/integ/next" "refs/tags/${TAG}:refs/tags/${TAG}"
          sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/integ/next; then
            echo "error: $TAG ($sha) is not on origin/integ/next" >&2
            exit 1
          fi
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "error: $TAG ($sha) is not the triggering commit $GITHUB_SHA" >&2
            exit 1
          fi
          echo "tag $TAG -> $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: github.repository == 'Exploded-views/herdr'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            run_prefix: ''
            file_expect: 'Mach-O 64-bit executable arm64'
          - target: x86_64-apple-darwin
            os: macos-latest
            run_prefix: 'arch -x86_64'
            file_expect: 'Mach-O 64-bit executable x86_64'
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            run_prefix: ''
            file_expect: 'ELF 64-bit.*x86-64.*(statically|static-pie) linked'
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            run_prefix: 'qemu-aarch64-static'
            file_expect: 'ELF 64-bit.*ARM aarch64.*(statically|static-pie) linked'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
      TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}
      RUN_PREFIX: ${{ matrix.run_prefix }}
      FILE_EXPECT: ${{ matrix.file_expect }}
    steps:
      - name: Checkout the tag's commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the tag's base version matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          BASE="${TAG#v}"
          BASE="${BASE%%-ev.*}"
          if [ "$CARGO_VERSION" != "$BASE" ]; then
            echo "error: tag $TAG is based on $BASE but Cargo.toml version is $CARGO_VERSION" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            echo "Using apt mirrors:"
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install qemu to run the aarch64 Linux binary
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get install -y qemu-user-static

      - name: Install Rosetta to run the x86_64 macOS binary
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --locked --release --target "$TARGET"

      - name: Check the binary's architecture and that it runs
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/herdr"
          file "$bin"
          file "$bin" | grep -Eq "$FILE_EXPECT"
          base="${TAG#v}"
          base="${base%%-ev.*}"
          read -r -a prefix <<< "$RUN_PREFIX"
          out="$("${prefix[@]}" "$bin" --version)"
          echo "$out"
          printf '%s' "$out" | grep -qF "$base"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="herdr-${TAG}-${TARGET}"
          mkdir -p dist
          tar -czf "dist/${name}.tar.gz" -C "target/${TARGET}/release" herdr
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          cat "dist/${name}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: github.repository == 'Exploded-views/herdr'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require repository admins
        shell: bash
        run: |
          set -euo pipefail
          for actor in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" --jq .permission)"
            if [ "$permission" != "admin" ]; then
              echo "error: $actor must have repository admin permission to publish" >&2
              exit 1
            fi
          done

      - name: Checkout the tag's commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify the artifacts
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find dist -name '*.sha256' | wc -l)" -eq 4
          (cd dist && sha256sum -c ./*.sha256)

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          # The FORK-CHANGELOG.md section headed "## <tag>", if there is one.
          awk -v tag="$TAG" '
            /^## / { if (on) exit; on = ($2 == tag) ; next }
            on { print }
          ' FORK-CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "See FORK-CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          fi
          {
            echo
            echo "Unsigned and not notarized. Check the tarball with"
            echo "shasum -a 256 -c herdr-${TAG}-<target>.tar.gz.sha256, extract it, then on macOS run"
            echo "xattr -d com.apple.quarantine herdr."
          } >> "$RUNNER_TEMP/notes.md"

      - name: Create the release as a draft, then publish it
        shell: bash
        run: |
          set -euo pipefail
          tag_still_at_sha() {
            current="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | awk -v ref="refs/tags/${TAG}" '$2 == (ref "^{}") { peeled = $1 } $2 == ref { plain = $1 } END { print (peeled != "" ? peeled : plain) }')"
            if [ "$current" != "$SHA" ]; then
              echo "error: $TAG moved from $SHA to ${current:-nothing} during the run" >&2
              exit 1
            fi
          }
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | .id')"
          if [ -n "$existing" ]; then
            echo "error: a release or draft already exists for $TAG; delete it first" >&2
            exit 1
          fi
          tag_still_at_sha
          release_id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$SHA" \
            -f name="$TAG" \
            -F body=@"$RUNNER_TEMP/notes.md" \
            -F draft=true \
            -F prerelease="$PRERELEASE" \
            --jq .id)"
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "error: the create call returned no release id for $TAG: '$release_id'" >&2
            exit 1
          fi
          echo "draft release $release_id created for $TAG; delete it if this run fails"
          for f in dist/*.tar.gz dist/*.sha256; do
            if ! out="$(printf 'Authorization: Bearer %s\n' "$GH_TOKEN" | curl --fail-with-body -sS -X POST -H @- -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$(basename "$f")")"; then
              echo "error: uploading $f failed: $out" >&2
              exit 1
            fi
          done
          tag_still_at_sha
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false
