# herdr-fork: fork-only workflow. Every job runs only in Exploded-views/herdr (not upstream,
# not forks of this fork), and upstream's
# own workflows are untouched. Linux builds and tests in the same image local runs use
# (fork-ci.Dockerfile via scripts/fork/linux-test.sh); macOS runs natively, mirroring
# upstream ci.yml. Unofficial stopgap; see FORK.md and docs/ci.md.
name: fork-ci

on:
  push:
    branches: ["integ/**", "feat/**"]
  pull_request:
    branches: ["integ/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.repository == 'Exploded-views/herdr'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Build image and fetch dependencies
        run: scripts/fork/linux-test.sh --fetch
      - name: just ci (offline, repo read-only)
        run: scripts/fork/linux-test.sh just ci

  macos:
    if: github.repository == 'Exploded-views/herdr'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.96.1
          components: rustfmt,clippy
      - name: Install Rust tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1.58.0,cargo-nextest@0.9.148
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0
      - name: just ci (same filter as upstream's macOS job)
        run: just ci 'not binary(live_handoff)'
